<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#123312" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="320" fill="#060a06" />
  <rect x="0" y="0" width="900" height="320" fill="url(#grid)" />

  <!-- outer dashed terminal border -->
  <rect x="16" y="16" width="868" height="288" fill="none" stroke="#39FF14" stroke-width="1.5" stroke-dasharray="6 5" rx="4" opacity="0.85" />

  <!-- title bar -->
  <circle cx="40" cy="40" r="5" fill="#39FF14" opacity="0.8" />
  <circle cx="58" cy="40" r="5" fill="#FFB000" opacity="0.8" />
  <circle cx="76" cy="40" r="5" fill="#39FF14" opacity="0.5" />
  <text x="96" y="45" fill="#39FF14" font-size="13" opacity="0.7">root@mohid: ~/profile</text>
  <line x1="16" y1="58" x2="884" y2="58" stroke="#1d5c1d" stroke-width="1" />

  <!-- big title -->
  <text x="50%" y="140" text-anchor="middle" fill="#39FF14" font-size="58" font-weight="bold" filter="url(#glow)" letter-spacing="4">MOHID_UMER</text>

  <!-- subtitle typed line -->
  <text x="50%" y="180" text-anchor="middle" fill="#9EFFAA" font-size="16" opacity="0.9">&gt; cybersecurity | full-stack | systems</text>

  <!-- boot lines -->
  <text x="48" y="222" fill="#39FF14" font-size="13" opacity="0.85">me@mohid:~$ sudo su</text>
  <text x="48" y="242" fill="#39FF14" font-size="13" opacity="0.85">[sudo] password for me: ••••••••</text>
  <text x="48" y="262" fill="#39FF14" font-size="13" opacity="0.85">[ OK ] Access granted — root shell opened</text>
  <text x="48" y="282" fill="#39FF14" font-size="13">
    <tspan opacity="0.85">root@mohid:~# </tspan><tspan fill="#39FF14">_</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite" />
  </text>

  <!-- scanline sweep -->
  <rect x="16" y="16" width="868" height="18" fill="url(#scan)">
    <animate attributeName="y" values="16;290;16" dur="4.5s" repeatCount="indefinite" />
  </rect>
</svg>
